# Rime schema
# encoding: utf-8

__include: luna_pinyin.schema:/

schema:
  schema_id: luna_pinyin_simp
  name: 朙月拼音·简化字
  version: "0.22"
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    朙月拼音，簡化字輸出模式，支持九宫格和24键切换。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: zh_simp
    reset: 1
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: keyboard_layout
    reset: 0
    states: [ 九宫格, 24键 ]

translator:
  prism: luna_pinyin_simp

simplifier:
  option_name: zh_simp

key_binder:
  bindings/+:
    - { when: always, accept: Control+Shift+4, toggle: zh_simp }
    - { when: always, accept: Control+Shift+dollar, toggle: zh_simp }
    - { when: always, accept: Control+Shift+9, toggle: keyboard_layout }
    - { when: always, accept: Control+Shift+parenleft, toggle: keyboard_layout }

keyboard:
  layout:
    - name: 24键
      keys:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [z, x, c, v, b, n, m]
    - name: 九宫格
      keys:
        - [",", "@/.", "2", "3", "4", "BackSpace"]
        - ["。", "1", "5", "6", "7", "重输"]
        - ["?", "4", "8", "9", "0", "0"]
        - ["符", "123", "space", "中", "搜索"]
      key_codes:
        - [44, 64, 50, 51, 52, -1]
        - [12290, 49, 53, 54, 55, -2]
        - [63, 52, 56, 57, 48, 48]
        - [-3, -4, 32, -5, -6]
      key_labels:
        - [",", "@/.", "ABC", "DEF", "GHI", "⌫"]
        - ["。", "1", "JKL", "MNO", "PQRS", "重输"]
        - ["?", "4", "TUV", "WXYZ", "0", "0"]
        - ["符", "123", "space", "中", "搜索"]
      key_press_preview:
        - [true, true, true, true, true, false]
        - [true, true, true, true, true, false]
        - [true, true, true, true, true, true]
        - [false, false, false, false, false]

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __patch:
      - pinyin:/abbreviation
      - pinyin:/spelling_correction
      - pinyin:/key_correction
      - pinyin:/nine_grid_correction
