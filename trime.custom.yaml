# Trime 自定义
patch:
  "style/locale": zh_CN # 添加为汉语简体
  "style/show_preview": false #按鍵提示
  "style/show_comment": false #顯示提示區
  "style/key_sound": false
  "style/color_scheme": lost_temple
  
  # 键盘布局切换按钮
  "style/keyboard_switch_button": true
  "style/keyboard_switch_button_text": "布局"
  "style/keyboard_switch_button_position": "top"
  "style/keyboard_switch_button_width": 60
  "style/keyboard_switch_button_height": 40
  "style/keyboard_switch_button_margin": 5
  "style/keyboard_switch_button_text_size": 16
  "style/keyboard_switch_button_text_color": 0xFFFFFFFF
  "style/keyboard_switch_button_background_color": 0x4D000000
  "style/keyboard_switch_button_corner_radius": 4
  "style/keyboard_switch_button_elevation": 2

  # 键盘布局配置
  "preset_keyboards/nine_grid":
    name: 九宫格
    author: "modified from default"
    rows:
      - keys: [",", "@/.", "2", "3", "4", "BackSpace"]
        labels: [",", "@/.", "ABC", "DEF", "GHI", "⌫"]
      - keys: ["。", "1", "5", "6", "7", "重输"]
        labels: ["。", "1", "JKL", "MNO", "PQRS", "重输"]
      - keys: ["?", "4", "8", "9", "0", "0"]
        labels: ["?", "4", "TUV", "WXYZ", "0", "0"]
      - keys: ["符", "123", "space", "中", "搜索"]
        labels: ["符", "123", "space", "中", "搜索"]
    ascii_mode: 0
    width: 10
    height: 55
    keys:
      space: {width: 3}
      BackSpace: {width: 1.5}
      重输: {width: 1.5}
      搜索: {width: 1.5}

  "preset_keyboards/default":
    name: 24键
    author: "modified from default"
    ascii_mode: 0
    width: 10
    height: 55
    keys:
      space: {width: 3}
      BackSpace: {width: 1.5}
      重输: {width: 1.5}
      搜索: {width: 1.5}

  "style/keyboards": [nine_grid, default]
  "style/keyboard_type": nine_grid

  # 开关状态
  "switches/@0/reset": 0
  "switches/@0/states": [ 中文, 西文 ]
  "switches/@1/states": [ 半角, 全角 ]
  "switches/@2/reset": 1
  "switches/@2/states": [ 漢字, 汉字 ]
  "switches/@3/states": [ 。，, ．， ]
  "switches/@4/reset": 0
  "switches/@4/states": [ 九宫格, 24键 ]
...
